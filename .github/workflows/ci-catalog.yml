name: Catalog Package CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CATALOG_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=catalog_ci;charset=utf8mb4
  CATALOG_TEST_DB_USER: catalog_test
  CATALOG_TEST_DB_PASSWORD: catalog_test

jobs:
  catalog-latest:
    name: Catalog latest dependencies (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: catalog_ci
          MYSQL_USER: catalog_test
          MYSQL_PASSWORD: catalog_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    defaults:
      run:
        working-directory: Modules/Catalog

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql
          tools: composer
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: PHP syntax
        run: find src tests -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l

      - name: Resolve latest compatible dependencies
        run: composer update --no-interaction --prefer-dist --no-progress --prefer-stable

      - name: Check platform requirements
        run: composer check-platform-reqs

      - name: Composer audit
        run: composer audit --no-interaction --abandoned=fail

      - name: PHPStan level max
        run: composer analyse

      - name: Unit tests
        run: composer test:unit

      - name: MySQL Integration tests
        run: composer test:integration

      - name: Full Catalog suite
        run: composer test

  catalog-lowest:
    name: Catalog lowest dependencies (PHP 8.2)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: catalog_ci
          MYSQL_USER: catalog_test
          MYSQL_PASSWORD: catalog_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    defaults:
      run:
        working-directory: Modules/Catalog

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f
        with:
          php-version: "8.2"
          extensions: mbstring, pdo, pdo_mysql
          tools: composer
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: PHP syntax
        run: find src tests -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l

      - name: Resolve lowest supported dependencies
        run: composer update --prefer-lowest --prefer-stable --no-interaction --prefer-dist --no-progress

      - name: Check platform requirements
        run: composer check-platform-reqs

      - name: Composer audit
        run: composer audit --no-interaction --abandoned=fail

      - name: PHPStan level max
        run: composer analyse

      - name: Unit tests
        run: composer test:unit

      - name: MySQL Integration tests
        run: composer test:integration

      - name: Full Catalog suite
        run: composer test

  workflow-lint:
    name: Workflow syntax lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate GitHub Actions workflows
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo rhysd/actionlint:1.7.7

  catalog-quality-gate:
    name: Catalog Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [catalog-latest, catalog-lowest, workflow-lint]
    if: always()

    steps:
      - name: Check Catalog required jobs
        run: |
          set -euo pipefail
          if [ "${{ needs.catalog-latest.result }}" != "success" ]; then
            echo "catalog-latest: ${{ needs.catalog-latest.result }}"
            exit 1
          fi
          if [ "${{ needs.catalog-lowest.result }}" != "success" ]; then
            echo "catalog-lowest: ${{ needs.catalog-lowest.result }}"
            exit 1
          fi
          if [ "${{ needs.workflow-lint.result }}" != "success" ]; then
            echo "workflow-lint: ${{ needs.workflow-lint.result }}"
            exit 1
          fi
          echo "All Catalog CI jobs passed."
