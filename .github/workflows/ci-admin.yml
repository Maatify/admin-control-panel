name: Admin CI

on:
  push:
    # Pull requests run Admin CI on every target branch. Direct pushes only
    # run it on main to avoid executing the same PR commit twice.
    branches: ["main"]
    paths:
      - "app/**"
      - "Modules/**"
      - "public/**"
      - "tests/**"
      - "scripts/**"
      - "bin/**"
      - "tools/**"
      - "database/**/*.sql"
      - "composer.json"
      - "composer.lock"
      - ".env.example"
      - "phpstan.neon"
      - "phpstan.neon.dist"
      - "phpunit.*.xml"
      - ".github/workflows/**"
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ADMIN_APP_ENV: testing
  ADMIN_DB_HOST: 127.0.0.1
  ADMIN_DB_PORT: 3306
  ADMIN_DB_NAME: admin_control_panel_ci_test
  ADMIN_DB_USER: admin_test
  ADMIN_DB_PASS: admin_test

jobs:
  admin-tests:
    name: Admin Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: admin_control_panel_ci_test
          MARIADB_USER: admin_test
          MARIADB_PASSWORD: admin_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    strategy:
      fail-fast: false
      matrix:
        php: ["8.2"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, openssl, redis, bcmath, mbstring, curl, gd, fileinfo, intl, readline
          tools: composer
          cache: composer
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Allow trigger creation for the test DB user
        run: |
          mysql -h127.0.0.1 -P3306 -uroot -proot \
            -e "SET GLOBAL log_bin_trust_function_creators = 1;"

      - name: Initialize Admin test database schema
        run: |
          for schema_file in database/b001.schema.sql database/a001.languages.sql database/a005.content_documents.schema.sql; do
            mysql -h127.0.0.1 -P3306 -uroot -proot "$ADMIN_DB_NAME" < "$schema_file"
          done
          mysql -h127.0.0.1 -P3306 -uroot -proot "$ADMIN_DB_NAME" < database/seeders/permissions_seed.sql

      - name: Non-integration tests
        run: composer test:non-integration

      - name: Integration tests
        run: vendor/bin/phpunit --configuration phpunit.admin.xml --filter Integration
